name: Static nmap release

# Once a day, and whenever the pins in download_sources.sh change on main:
# look up the latest stable nmap release on nmap.org and build it as a static
# binary when
#   - this repository has no release of that version yet (tag: 7.993), or
#   - the OpenSSL/Alpine versions pinned in download_sources.sh differ from
#     the ones its newest release was built with (rebuild: 7.993-2, -3, ...).
# The build is tested, then published with SHA256SUMS and an attestation.

on:
  schedule:
    - cron: '23 5 * * *'
  push:
    branches: [main]
    paths: [download_sources.sh]
  workflow_dispatch:
    inputs:
      version:
        description: 'nmap version to build (empty: latest stable release on nmap.org)'
        type: string
        required: false
        default: ''
      publish:
        description: 'Publish a GitHub release (off: build and test only)'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

# One run at a time; a second run waits instead of building the same release.
concurrency:
  group: static-nmap-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  # Scheduled and push runs have no inputs and always publish.
  PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write   # keepalive: re-enable this workflow
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_latest: ${{ steps.version.outputs.is_latest }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      inputs: ${{ steps.plan.outputs.inputs }}
      previous_inputs: ${{ steps.plan.outputs.previous_inputs }}
    steps:
      - uses: actions/checkout@v7

      # GitHub disables scheduled workflows in public repositories after 60
      # days without activity; re-enabling through the API is meant to keep
      # the daily check alive without dummy commits (best effort).
      - name: Keep the daily schedule enabled
        if: github.event_name == 'schedule'
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/enable" \
            || echo "::warning::could not re-enable the workflow"

      - name: Determine the nmap version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          latest=$(.github/scripts/latest-nmap-version.sh)
          version=${INPUT_VERSION:-$latest}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+[A-Za-z0-9]*$ ]]; then
            echo "::error::invalid nmap version '$version'"; exit 1
          fi
          echo "Latest stable nmap release: $latest; selected: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_latest=$([ "$version" = "$latest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Plan the release
        id: plan
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          plan=$(.github/scripts/plan-release.sh "$VERSION")
          echo "$plan"
          if [ "$PUBLISH" != true ]; then
            echo "Dry run: building regardless of the plan."
            plan=$(grep -v '^build=' <<<"$plan"; echo build=true)
          fi
          echo "$plan" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write      # create the release
      id-token: write      # build provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
      DIST_NAME: nmap-${{ needs.check.outputs.tag }}-linux-x86_64-static
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: .github/scripts/build-and-test.sh "$VERSION"

      - name: Package
        run: |
          mkdir -p staging dist
          cp -a "output/$VERSION" "staging/nmap-$VERSION"
          # Build details go into the release notes; inside the archive the
          # file would end up as /usr/local/.build-info.
          rm "staging/nmap-$VERSION/.build-info"
          tar -C staging --owner=0 --group=0 --numeric-owner \
            -czf "dist/$DIST_NAME.tar.gz" "nmap-$VERSION"
          # The exact source code the binaries were built from goes next to
          # them (the NPSL, like the GPL, requires access to the source).
          openssl=$(sed -n 's/^OPENSSL_VERSION=//p' download_sources.sh)
          cp "sources/nmap-$VERSION.tar.bz2" "sources/nmap-$VERSION.tar.bz2.asc" \
            "sources/openssl-$openssl.tar.gz" dist/
          (cd dist && sha256sum -- *.tar.* > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ env.DIST_NAME }}.tar.gz

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          IS_LATEST: ${{ needs.check.outputs.is_latest }}
          INPUTS: ${{ needs.check.outputs.inputs }}
          PREVIOUS_TAG: ${{ needs.check.outputs.previous_tag }}
          PREVIOUS_INPUTS: ${{ needs.check.outputs.previous_inputs }}
        run: |
          info="output/$VERSION/.build-info"
          openssl=$(sed -n 's/^openssl_version=//p' "$info")
          alpine=$(sed -n 's/^alpine_version=//p' "$info")
          # The recorded inputs must describe what was actually built.
          if [ "$INPUTS" != "openssl=$openssl alpine=$alpine" ]; then
            echo "::error::built with openssl=$openssl alpine=$alpine, planned $INPUTS"; exit 1
          fi
          rebuild=""
          if [ -n "$PREVIOUS_TAG" ]; then
            rebuild="Rebuild of $PREVIOUS_TAG with updated dependencies: \`$PREVIOUS_INPUTS\` → \`$INPUTS\`."
          fi
          sed -e "s|@VERSION@|$VERSION|g" -e "s|@OPENSSL@|$openssl|g" \
              -e "s|@ALPINE@|$alpine|g" -e "s|@NAME@|$DIST_NAME|g" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|g" -e "s|@INPUTS@|$INPUTS|g" \
              -e "s|@TAG@|$TAG|g" -e "s|@REBUILD@|$rebuild|" > notes.md <<'EOF'
          Statically linked **nmap**, **ncat** and **nping** @VERSION@ for x86_64 Linux,
          built from the official nmap.org release (GPG signature checked) with
          [`build_nmap_static.sh`](https://github.com/@REPO@/blob/main/build_nmap_static.sh). They have no runtime
          dependencies: musl libc, OpenSSL, libssh2, Lua/NSE and libpcap are all built in.

          @REBUILD@

          | Component | Version |
          |---|---|
          | nmap | @VERSION@ |
          | OpenSSL | @OPENSSL@, with the legacy provider (MD4, DES, RC4) built in for NSE |
          | Alpine Linux (build environment) | @ALPINE@ |

          ### Install

          ```sh
          sudo tar -C /usr/local --strip-components=1 -xzf @NAME@.tar.gz
          ```

          Or unpack the archive anywhere and run `nmap-@VERSION@/bin/nmap`; nmap finds its
          scripts and data next to the binary.

          ### Verify

          ```sh
          sha256sum -c --ignore-missing SHA256SUMS
          gh attestation verify @NAME@.tar.gz -R @REPO@
          ```

          The `gh attestation` check needs GitHub CLI 2.49 or newer.

          ### Source code and license

          Nmap is licensed under the [Nmap Public Source License](https://nmap.org/npsl/)
          (NPSL v0.95). The archive includes that license, a NOTICE and the licenses
          of all statically linked libraries in `share/doc/nmap/`.

          This release also carries the exact, unmodified source code the binaries
          were built from: `nmap-@VERSION@.tar.bz2` (the official nmap.org release)
          with its GPG signature, and `openssl-@OPENSSL@.tar.gz`. The build scripts
          are in this repository at tag [`@TAG@`](https://github.com/@REPO@/tree/@TAG@).

          This is an unofficial build. It is not affiliated with, sponsored by, or
          endorsed by Nmap Software LLC or the Nmap Project. Nmap is a trademark of
          Nmap Software LLC.

          <!-- build-inputs: @INPUTS@ -->
          EOF

          # Never touch a published release; replace a leftover draft.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::release $TAG is already published"; exit 1
            fi
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          # Upload as a draft first, so a failed upload never looks like a finished build.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "Nmap $TAG (static)" --notes-file notes.md \
            "dist/$DIST_NAME.tar.gz" dist/SHA256SUMS "dist/nmap-$VERSION.tar.bz2" \
            "dist/nmap-$VERSION.tar.bz2.asc" "dist/openssl-$openssl.tar.gz"
          gh release edit "$TAG" --draft=false --latest="$IS_LATEST"
